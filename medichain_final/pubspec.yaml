name: medichain
description: Medicine Authenticity & Cold-Chain Tracker on Blockchain
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Blockchain & Web3
  web3dart: ^2.7.3
  http: ^1.2.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1
  qr_code_scanner: ^1.0.1

  # Navigation & State
  go_router: ^14.2.1
  provider: ^6.1.2

  # Utils
  shared_preferences: ^2.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.0
  clipboard: ^0.1.3
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.3.1
  timeago: ^3.7.0
  crypto: ^3.0.3
  convert: ^3.1.1
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
